# main に入ったコードを Cloudflare Workers にデプロイする。
# token は Environment `production`（main からしか使えない）の secret に置くので、
# fork からの PR では動かず、secret も渡らない。設定は README の「自動デプロイ」を参照。
name: deploy

on:
  push:
    branches: [main]
    # Worker に関係しないファイルだけの変更ではデプロイしない（test/ は CI を兼ねるので外さない）
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - '.devcontainer/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # デプロイには他の run が作ったキャッシュを使わない
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
